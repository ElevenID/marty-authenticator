plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}



// Cargo distributes the Android verifier AAR inside its checksummed crate.
def rustMetadata = providers.exec {
    workingDir rootProject.file('../rust')
    commandLine 'cargo', 'metadata', '--format-version', '1', '--locked',
            '--filter-platform', 'aarch64-linux-android'
}.standardOutput.asText.get()
def verifierPackage = new groovy.json.JsonSlurper().parseText(rustMetadata).packages.find {
    it.name == 'rustls-platform-verifier-android'
}
if (verifierPackage == null) {
    throw new GradleException('Cargo metadata is missing the Android platform TLS verifier')
}
def verifierVersion = verifierPackage.version
def verifierRoot = new File(verifierPackage.manifest_path).parentFile
def verifierAar = new File(verifierRoot, "maven/rustls/rustls-platform-verifier/${verifierVersion}/rustls-platform-verifier-${verifierVersion}.aar")
if (!verifierAar.isFile()) {
    throw new GradleException('Android platform TLS verifier AAR is missing from the resolved crate')
}

dependencies {
    implementation files(verifierAar)
    // Add this [coreLibraryDesugaring] inside [dependencies]
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'

    // SpruceID Mobile SDK for verifiable credentials and mDoc/MDL
    implementation 'com.spruceid.mobile.sdk:mobilesdk:0.12.11'

    // OkHttp for async HTTP operations in SpruceID adapters
    implementation "com.squareup.okhttp3:okhttp:4.12.0"

    // Kotlin Coroutines for async operations
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.0"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}


def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

def keystorePropertiesNetknights = new Properties()
def keystorePropertiesFileNetknights = rootProject.file('app/src/netknights/key.properties')
if (keystorePropertiesFileNetknights.exists()) {
    keystorePropertiesNetknights.load(new FileInputStream(keystorePropertiesFileNetknights))
}

def keystorePropertiesNetknightsDebug = new Properties()
def keystorePropertiesFileNetknightsDebug = rootProject.file('app/src/netknights_debug/key.properties')
if (keystorePropertiesFileNetknightsDebug.exists()) {
    keystorePropertiesNetknightsDebug.load(new FileInputStream(keystorePropertiesFileNetknightsDebug))
}


android {
    namespace 'it.netknights.piauthenticator'

    // API 37 is not yet published in the stable Android SDK repository used by
    // GitHub-hosted runners. Keep the newest stable platform until it is.
    compileSdkVersion 36
    ndkVersion = "28.2.13676358"  // Updated to highest version for compatibility

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    packagingOptions {
        jniLibs {
            // Retain the reviewed runtime bytes for the APK digest check.
            keepDebugSymbols += ['**/libonnxruntime.so']
        }
    }

    defaultConfig {
        applicationId "it.netknights.piauthenticator"
        minSdkVersion 26  // Required for SpruceID Mobile SDK
        targetSdkVersion 35
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    signingConfigs {
        netknights {
            storeFile keystorePropertiesNetknights['storeFile'] ? file(keystorePropertiesNetknights['storeFile']) : null
            storePassword keystorePropertiesNetknights['storePassword']
            keyAlias keystorePropertiesNetknights['keyAlias']
            keyPassword keystorePropertiesNetknights['keyPassword']
        }
        netknights_debug {
            storeFile keystorePropertiesNetknightsDebug['storeFile'] ? file(keystorePropertiesNetknightsDebug['storeFile']) : null
            storePassword keystorePropertiesNetknightsDebug['storePassword']
            keyAlias keystorePropertiesNetknightsDebug['keyAlias']
            keyPassword keystorePropertiesNetknightsDebug['keyPassword']
        }
    }

    flavorDimensions "pi-authenticator"

    productFlavors {
        netknights{
            dimension "pi-authenticator"
            applicationId "it.netknights.piauthenticator"
            resValue "string", "app_name", "privacyIDEA Authenticator"
            signingConfig signingConfigs.netknights
        }
        netknights_debug{
            dimension "pi-authenticator"
            applicationId "it.netknights.piauthenticator.debug"
            resValue "string", "app_name", "Internal - privacyIDEA Authenticator"
            signingConfig signingConfigs.netknights_debug
        }
    }

    buildTypes {
        release {
            // Enables code shrinking, obfuscation, and optimization for only
            // your project's release build type.
            minifyEnabled false

            // Enables resource shrinking, which is performed by the
            // Android Gradle plugin.
            shrinkResources false

            // Includes the default ProGuard rules files that are packaged with
            // the Android Gradle plugin. To learn more, go to the section about
            // R8 configuration files.
            proguardFiles getDefaultProguardFile(
                    'proguard-android-optimize.txt'),
                    'proguard-rules.pro'
        }

        debug {
            applicationIdSuffix ".debug"
            debuggable true

            shrinkResources false

            proguardFiles getDefaultProguardFile(
                    'proguard-android-optimize.txt'),
                    'proguard-rules.pro'
        }
    }
}

flutter {
    source '../..'
}
