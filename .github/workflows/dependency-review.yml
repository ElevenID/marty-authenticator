name: Reusable dependency review

on:
  workflow_call:

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require an empty workspace before tool setup
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          python3 -I - <<'PY'
          import os
          from pathlib import Path

          workspace = Path(os.environ["GITHUB_WORKSPACE"])
          if workspace != workspace.resolve(strict=True) or not workspace.is_dir():
              raise SystemExit("The runner workspace must be a canonical directory")
          if any(workspace.iterdir()):
              raise SystemExit("Tool setup requires an empty runner workspace")
          temporary = Path(os.environ["RUNNER_TEMP"])
          if temporary != temporary.resolve(strict=True) or not temporary.is_dir():
              raise SystemExit("The runner temporary directory must be canonical")
          info = temporary.stat()
          if info.st_uid != os.getuid() or info.st_mode & 0o022:
              raise SystemExit("The runner temporary directory must be owned")
          for name in ("dependency-review-setup-user.npmrc", "dependency-review-setup-global.npmrc"):
              descriptor = os.open(temporary / name, os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW, 0o600)
              os.close(descriptor)
          PY
      - name: Select the reviewed action build runtime
        if: github.event_name == 'pull_request'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        env:
          NODE_OPTIONS: ""
          NODE_PATH: ""
          NPM_CONFIG_USERCONFIG: ${{ runner.temp }}/dependency-review-setup-user.npmrc
          NPM_CONFIG_GLOBALCONFIG: ${{ runner.temp }}/dependency-review-setup-global.npmrc
          NPM_CONFIG_IGNORE_SCRIPTS: "true"
        with:
          node-version: "24.22.1"
          package-manager-cache: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - name: Reserve disjoint trusted preparation paths
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          python3 -I - <<'PY'
          import os
          from pathlib import Path

          workspace = Path(os.environ["GITHUB_WORKSPACE"])
          if workspace != workspace.resolve(strict=True) or not workspace.is_dir():
              raise SystemExit("The candidate workspace must remain canonical")
          for name in ("_dependency-review-tooling", "_dependency-review-action"):
              try:
                  (workspace / name).lstat()
              except FileNotFoundError:
                  continue
              raise SystemExit("A candidate occupies a reserved preparation path")
          PY
      - name: Checkout the immutable reviewed preparation source
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          repository: ElevenID/marty-authenticator
          # Replaced with the reviewed helper commit in the two-commit publication.
          ref: "cd2378a3c4bcea0ca3da59e8b9e2dc8d0a52787e"
          path: _dependency-review-tooling
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/scripts/prepare_dependency_review.py
            /.github/dependency-review/
      - name: Require a fresh official action checkout path
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          python3 -I - <<'PY'
          import os
          from pathlib import Path

          workspace = Path(os.environ["GITHUB_WORKSPACE"])
          if workspace != workspace.resolve(strict=True) or not workspace.is_dir():
              raise SystemExit("The candidate workspace must remain canonical")
          try:
              (workspace / "_dependency-review-action").lstat()
          except FileNotFoundError:
              pass
          else:
              raise SystemExit("The official action checkout path already exists")
          PY
      - name: Checkout the exact official action source
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          repository: actions/dependency-review-action
          ref: a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
          path: _dependency-review-action
          persist-credentials: false
      - name: Rebuild and verify the identifier-only correction
        if: github.event_name == 'pull_request'
        shell: bash
        run: >-
          python3 -I _dependency-review-tooling/.github/scripts/prepare_dependency_review.py
          --action "$GITHUB_WORKSPACE/_dependency-review-action"
      - uses: ./_dependency-review-action
        if: github.event_name == 'pull_request'
        with:
          fail-on-severity: moderate
          deny-licenses: >-
            AGPL-1.0-only, AGPL-1.0-or-later,
            AGPL-3.0-only, AGPL-3.0-or-later,
            SSPL-1.0, BUSL-1.1
          # GitHub's Pub dependency snapshots currently emit lowercase SPDX
          # identifiers for these packages. Limit the exception to their exact
          # package URLs; vulnerability and denied-license checks still apply.
          # flutter_rust_bridge 2.13.0 was verified against its shipped MIT LICENSE.
          # GitHub reports it as lowercase "mit". Restrict this addition to that version.
          # Owner: ElevenID security. Review/remove by 2026-11-01.
          allow-dependencies-licenses: >-
            pkg:pub/flutter_rust_bridge@2.13.0,
            pkg:pub/listen,
            pkg:pub/permission_handler,
            pkg:pub/permission_handler_android,
            pkg:pub/permission_handler_apple,
            pkg:pub/permission_handler_html,
            pkg:pub/permission_handler_platform_interface,
            pkg:pub/permission_handler_windows,
            pkg:pub/win32
          retry-on-snapshot-warnings: true
          retry-on-snapshot-warnings-timeout: 600
