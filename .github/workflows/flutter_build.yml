name: Flutter Build
on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build_ios:
    name: (iOS configuration, unsigned)
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set Xcode version
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90
        with:
          xcode-version: "26.6"

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78
        with:
          distribution: "zulu"
          java-version: "17" # Use JDK 17 for better compatibility

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: "stable"
          flutter-version: "3.44.6"

      - run: flutter clean
      - run: flutter --version
      - run: flutter doctor -v
      - run: flutter pub get
      - run: flutter gen-l10n
      # Apple signing credentials are intentionally not used. Validate the
      # generated Xcode project without producing an iOS installer.
      - run: flutter build ios -t "lib/main_document.dart" --debug --flavor netknights --no-codesign --config-only

  smoke_ios:
    name: Installed wallet smoke (iOS simulator)
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set Xcode version
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90
        with:
          xcode-version: "26.6"

      - name: Set up native Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: "1.97.1"
          components: llvm-tools-preview

      - name: Set up native dependency helper runtime
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"

      - name: Require trusted native fork access
        if: vars.PRIVATE_FORKS_ENABLED == 'true'
        shell: bash
        working-directory: ${{ github.workspace }}
        run: python .github/scripts/private-forks.py check

      - name: Fetch locked native fork dependencies
        if: vars.PRIVATE_FORKS_ENABLED == 'true'
        shell: bash
        env:
          PRIVATE_FORKS_READ_TOKEN: ${{ secrets.PRIVATE_FORKS_READ_TOKEN }}
        run: python .github/scripts/private-forks.py fetch --manifest-path rust/Cargo.toml

      - name: Fetch locked public native dependencies
        if: vars.PRIVATE_FORKS_ENABLED != 'true'
        shell: bash
        run: cargo fetch --locked --manifest-path rust/Cargo.toml

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: "stable"
          flutter-version: "3.44.6"

      - run: flutter pub get --enforce-lockfile

      - name: Run wallet smoke on a fresh iPhone simulator
        shell: bash
        env:
          MARTY_IOS_SIMULATOR_SMOKE: "1"
        run: |
          set -euo pipefail
          # Use a device type known to be compatible with an installed iOS runtime.
          pair=$(xcrun simctl list devices available --json | jq -er '
            first(.devices | to_entries[] | select(.key | contains(".iOS-")) |
              .key as $runtime | .value[] | select(.name | startswith("iPhone")) |
              [$runtime, .deviceTypeIdentifier] | @tsv)')
          IFS=$'\t' read -r runtime device_type <<< "$pair"
          device=$(xcrun simctl create "WalletSmoke-${GITHUB_RUN_ID}" "$device_type" "$runtime")
          trap 'xcrun simctl delete "$device"' EXIT
          xcrun simctl boot "$device"
          xcrun simctl bootstatus "$device" -b
          # Flutter asks Xcode for both simulator architectures. The installed
          # simulator uses the host architecture, including for native Pods.
          export XCODE_XCCONFIG_FILE="$RUNNER_TEMP/wallet-smoke-simulator.xcconfig"
          printf 'ARCHS[sdk=iphonesimulator*] = %s\n' "$(uname -m)" > "$XCODE_XCCONFIG_FILE"
          smoke_log="$RUNNER_TEMP/wallet-ios-smoke.log"
          if ! make test-device-smoke DEVICE_ID="$device" FLUTTER_DEVICE_SMOKE_FLAGS=--verbose > "$smoke_log" 2>&1; then
            # Keep the symbol and its competing objects together in the job log.
            grep -Ei -A 3 'duplicate symbol|undefined symbol|error[: (]|fatal:|(^|[[:space:]])(ld|clang|llvm-nm):|No such file|not found|unrecognized|iOS bridge FFI linker response file written|PhaseScriptExecution|The following build commands failed|nonzero exit|Cargokit BuildTool failed|exception caught|tests failed|test failed|exit code [1-9]|timed out' "$smoke_log" | cut -c1-600 | tail -n 240 || true
            # Preserve Flutter's assembler output without printing Xcode's environment.
            awk '/kernel_snapshot_program: Complete/ { remaining=70; next }
                 remaining>0 {
                   remaining--
                   if ($0 !~ /export |[Tt]oken|[Ss]ecret|[Pp]assword|Bearer |[Aa]uthorization/)
                     print substr($0, 1, 450)
                 }' "$smoke_log" | tail -n 100
            exit 1
          fi
          # Flutter's verbose reporter can render its completion line differently.
          # The test command's exit status is the acceptance result.
          printf '%s\n' 'Installed wallet smoke command passed.'

  build_android_native:
    name: Android native (${{ matrix.abi }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - abi: armeabi-v7a
            platform: android-arm
          - abi: arm64-v8a
            platform: android-arm64
          - abi: x86_64
            platform: android-x64
    env:
      # Keep the existing debug assertions, features and bounded job lifetime.
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up native Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: "1.97.1"

      - name: Set up native dependency helper runtime
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"

      - name: Require trusted native fork access
        if: vars.PRIVATE_FORKS_ENABLED == 'true'
        shell: bash
        working-directory: ${{ github.workspace }}
        run: python .github/scripts/private-forks.py check

      - name: Fetch locked native fork dependencies
        if: vars.PRIVATE_FORKS_ENABLED == 'true'
        shell: bash
        env:
          PRIVATE_FORKS_READ_TOKEN: ${{ secrets.PRIVATE_FORKS_READ_TOKEN }}
        run: python .github/scripts/private-forks.py fetch --manifest-path rust/Cargo.toml

      - name: Fetch locked public native dependencies
        if: vars.PRIVATE_FORKS_ENABLED != 'true'
        shell: bash
        run: cargo fetch --locked --manifest-path rust/Cargo.toml

      - name: Set up Java Development Kit
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78
        with:
          distribution: "zulu"
          java-version: "21"

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: "stable"
          flutter-version: "3.44.6"

      - name: Install pinned Android SDK and NDK
        shell: bash
        run: |
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          sdkmanager_path="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$sdkmanager_path" ]]; then
            sdkmanager_path="$(find "$sdk_root/cmdline-tools" -path '*/bin/sdkmanager' -type f -perm -u+x | sort -V | tail -n 1)"
          fi
          test -n "$sdkmanager_path" && test -x "$sdkmanager_path"
          "$sdkmanager_path" "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"

      - name: Prepare Flutter configuration
        shell: bash
        run: |
          flutter clean
          flutter pub get
          flutter gen-l10n
          flutter build apk -t lib/main_document.dart --debug --no-pub --config-only
          git diff --exit-code --name-status HEAD --

      - name: Restore Gradle dependencies
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Source-build and export the assigned native ABI
        shell: bash
        env:
          NATIVE_ABI: ${{ matrix.abi }}
          FLUTTER_PLATFORM: ${{ matrix.platform }}
        run: |
          cd android
          ./gradlew --console=plain \
            --init-script "$GITHUB_WORKSPACE/.github/scripts/android-native-artifacts.init.gradle" \
            -Ptarget="$GITHUB_WORKSPACE/lib/main_document.dart" \
            -Ptarget-platform="$FLUTTER_PLATFORM" \
            -Pbase-application-name=android.app.Application \
            -PmartyNativeMode=source \
            -PmartyNativeAbi="$NATIVE_ABI" \
            -PmartyNativeArtifactRoot="$RUNNER_TEMP/wallet-native/$NATIVE_ABI" \
            martyExportAndroidNativeArtifact

      - name: Retain source-built native output for this workflow attempt
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: wallet-native-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}-${{ matrix.abi }}
          if-no-files-found: error
          retention-days: 3
          path: ${{ runner.temp }}/wallet-native/${{ matrix.abi }}/

  build_appbundle:
    name: (Android)
    needs: build_android_native
    # A failed/skipped native matrix must fail this existing required context,
    # rather than leaving the dependent packaging check silently skipped.
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - name: Require all native source jobs to succeed
        shell: bash
        env:
          NATIVE_SOURCE_RESULT: ${{ needs.build_android_native.result }}
        run: test "$NATIVE_SOURCE_RESULT" = success

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up native artifact validation runtime
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"

      - name: Set up native Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: "1.97.1"

      - name: Require trusted native fork access
        if: vars.PRIVATE_FORKS_ENABLED == 'true'
        shell: bash
        working-directory: ${{ github.workspace }}
        run: python .github/scripts/private-forks.py check

      - name: Fetch locked native fork dependencies
        if: vars.PRIVATE_FORKS_ENABLED == 'true'
        shell: bash
        env:
          PRIVATE_FORKS_READ_TOKEN: ${{ secrets.PRIVATE_FORKS_READ_TOKEN }}
        run: python .github/scripts/private-forks.py fetch --manifest-path rust/Cargo.toml

      - name: Fetch locked public native dependencies
        if: vars.PRIVATE_FORKS_ENABLED != 'true'
        shell: bash
        run: cargo fetch --locked --manifest-path rust/Cargo.toml

      - name: Set up Java Development Kit
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78
        with:
          distribution: "zulu"
          java-version: "21"

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: "stable"
          flutter-version: "3.44.6"

      - name: Install pinned Android SDK and NDK
        shell: bash
        run: |
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          sdkmanager_path="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$sdkmanager_path" ]]; then
            sdkmanager_path="$(find "$sdk_root/cmdline-tools" -path '*/bin/sdkmanager' -type f -perm -u+x | sort -V | tail -n 1)"
          fi
          test -n "$sdkmanager_path" && test -x "$sdkmanager_path"
          "$sdkmanager_path" "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"

      - name: Prepare Flutter configuration
        shell: bash
        run: |
          flutter clean
          flutter pub get
          flutter gen-l10n
          flutter build apk -t lib/main_document.dart --debug --no-pub --config-only
          git diff --exit-code --name-status HEAD --

      - name: Restore Gradle dependencies
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Qualify the source-transfer adapter with real Gradle
        shell: bash
        run: python scripts/qualify_android_native_adapter.py --gradle "$GITHUB_WORKSPACE/android/gradlew"

      - name: Download only this run's source-built native artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: wallet-native-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}-*
          merge-multiple: false
          digest-mismatch: error
          path: ${{ runner.temp }}/wallet-native-artifacts

      - name: Build both Android debug flavors from verified native outputs
        shell: bash
        run: |
          cd android
          ./gradlew --console=plain \
            --init-script "$GITHUB_WORKSPACE/.github/scripts/android-native-artifacts.init.gradle" \
            -Ptarget="$GITHUB_WORKSPACE/lib/main_document.dart" \
            -Ptarget-platform=android-arm,android-arm64,android-x64 \
            -Pbase-application-name=android.app.Application \
            -PmartyNativeMode=assemble \
            -PmartyNativeArtifactRoot="$RUNNER_TEMP/wallet-native-artifacts" \
            assembleNetknightsDebug assembleNetknights_debugDebug

      - name: Validate exact native provenance, all ABIs and ELF alignment
        shell: bash
        run: |
          python -m unittest discover -s scripts -p 'test_android_native_artifacts.py'
          python -m unittest discover -s scripts -p 'test_verify_android_native_bridge.py'
          python scripts/verify_android_native_bridge.py \
            --native-artifacts "$RUNNER_TEMP/wallet-native-artifacts" \
            build/app/outputs/flutter-apk/app-netknights-debug.apk \
            build/app/outputs/flutter-apk/app-netknights_debug-debug.apk \
            | tee "$RUNNER_TEMP/android-native-payloads.jsonl"

      - name: Retain verified debug APKs for isolated device qualification
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: wallet-native-debug-apks-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          if-no-files-found: error
          retention-days: 3
          path: |
            build/app/outputs/flutter-apk/app-netknights-debug.apk
            build/app/outputs/flutter-apk/app-netknights_debug-debug.apk
            ${{ runner.temp }}/android-native-payloads.jsonl
