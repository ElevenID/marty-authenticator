name: Rust Bridge Codegen

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "rust/**"
    paths:
      - "rust/src/**"
      - "rust/Cargo.toml"
      - "rust/Cargo.lock"
      - "flutter_rust_bridge.yaml"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "lib/**/*.dart"
      - "lib/services/qr_scanner_service_enhanced.dart"
      - "lib/services/spruce_client_extended.dart"
      - "lib/services/spruce_platform_service_extended.dart"
      - "lib/views/credential_selection_view.dart"
      - ".github/workflows/rust-bridge-codegen.yml"
  pull_request:
    paths:
      - "rust/src/**"
      - "rust/Cargo.toml"
      - "rust/Cargo.lock"
      - "flutter_rust_bridge.yaml"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "lib/**/*.dart"
      - "lib/services/qr_scanner_service_enhanced.dart"
      - "lib/services/spruce_client_extended.dart"
      - "lib/services/spruce_platform_service_extended.dart"
      - "lib/views/credential_selection_view.dart"
      - ".github/workflows/rust-bridge-codegen.yml"

permissions:
  contents: read

jobs:
  generated-bindings:
    name: Generated bindings are current
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version: "3.44.6"
          cache: true

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: "1.97.1"
          components: rustfmt

      - name: Install Flutter dependencies
        run: flutter pub get --enforce-lockfile

      - name: Install pinned bridge generator
        run: cargo install flutter_rust_bridge_codegen --version 2.12.0 --locked

      - name: Generate bridge surfaces
        run: flutter_rust_bridge_codegen generate --config-file flutter_rust_bridge.yaml

      - name: Test native wallet routing and validation
        run: cargo test --locked --manifest-path rust/Cargo.toml --lib wallet_

      - name: Test native status-list and liveness behavior
        run: |
          cargo test --locked --manifest-path rust/Cargo.toml --lib status::tests
          cargo test --locked --manifest-path rust/Cargo.toml --lib liveness_tests

      - name: Upload generated bridge surfaces
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: flutter-rust-bridge-generated
          if-no-files-found: error
          retention-days: 3
          path: |
            rust/src/frb_generated.rs
            lib/rust/
            ios/Runner/bridge_generated.h
            macos/Runner/bridge_generated.h

      - name: Reject stale generated bindings
        run: git diff --exit-code -- rust/src/frb_generated.rs lib/rust ios/Runner/bridge_generated.h macos/Runner/bridge_generated.h

      - name: Enforce native QR protocol ownership
        shell: bash
        run: |
          if grep -Eq '_parse(URLQR|JSONQR|DIDCommQR|PushRegistrationQR)|Uri\.(parse|tryParse)\(|rawData\.(startsWith|contains)\(' lib/services/qr_scanner_service_enhanced.dart; then
            echo 'QR protocol parsing must remain in the Rust bridge and marty-core.' >&2
            exit 1
          fi

      - name: Enforce native presentation routing and binding ownership
        shell: bash
        run: |
          if grep -Eq "startsWith\(['\"]mdoc|default-(challenge|domain)" \
            lib/services/spruce_client_extended.dart \
            lib/services/spruce_platform_service_extended.dart \
            lib/views/credential_selection_view.dart; then
            echo 'Presentation routing and holder binding must remain in the Rust bridge and marty-core.' >&2
            exit 1
          fi

      - name: Enforce native holder-key and offer-normalization ownership
        shell: bash
        run: |
          if grep -REn --include='*.dart' \
            'Ecdsa\.p256|newKeyPair\(|_computeKid|normalizeOid4vciCredentialOfferUri' lib; then
            echo 'P-256 holder keys and OID4VCI offer normalization must remain in Rust.' >&2
            exit 1
          fi

      - name: Enforce native status-list and liveness ownership
        shell: bash
        run: |
          if grep -REn --include='*.dart' \
            'gzip\.decode|base64Decode\(|Hmac\(sha256|local-dev-secret' \
            lib/models lib/services lib/views; then
            echo 'Status-list decoding and liveness challenge signing must remain in Rust.' >&2
            exit 1
          fi
