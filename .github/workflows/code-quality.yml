name: Code Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: code-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter-quality:
    uses: ElevenID/.github/.github/workflows/quality-flutter.yml@d8068d1da4dd5b4ca5daacbb76282ffd2a241f87
    with:
      flutter-version: "3.44.6"
      test-command: flutter test --coverage
      build-command: flutter build apk --debug --flavor netknights -t lib/main_document.dart
      android-api-level: "36"
