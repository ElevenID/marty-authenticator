name: Code Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: code-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter-quality:
    uses: ElevenID/.github/.github/workflows/quality-flutter.yml@f4672c65826a8f0962426a3e8401b7ff3ff3c3ad
    with:
      flutter-version: "3.44.6"
      test-command: flutter test --coverage
      build-command: flutter build apk --debug --flavor netknights -t lib/main_document.dart
      android-api-level: "36"
