name: Code Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: code-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter-quality:
    uses: ElevenID/.github/.github/workflows/quality-flutter.yml@bf660ca444c40b260b413d599f6504d4324227e8
    with:
      flutter-version: "3.44.6"
      working-directory: "."
      native-rust-bridge: true
      test-command: flutter test --coverage
      build-command: flutter build apk --debug --flavor netknights -t lib/main_document.dart
      android-api-level: "36"
    secrets:
      PRIVATE_FORKS_READ_TOKEN: ${{ secrets.PRIVATE_FORKS_READ_TOKEN }}
