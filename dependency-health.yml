version: 1
dependencies:
  - package: permission_handler
    ecosystem: pub
    owner: ElevenID
    upstream: https://github.com/Baseflow/flutter-permission-handler
    current: 12.0.3
    target: 13.x
    status: watch
    decision: upgrade
    advisories: []
    tracking-issue: https://github.com/ElevenID/marty-authenticator/issues/25
    review-after: 2026-11-15
    rationale: Rechecked 2026-10-16 against the upstream 13.0.2 changelog and Google's repository2-3.xml. Android 37.0 is now published, but this application still compiles against SDK 36. Version 13 requires SDK 37 and changes Android permanentlyDenied handling to a request-driven flow. Retain 12.0.3 until the platform upgrade and permission behavior migration are validated together in issue 25.
  - package: flutter_secure_storage_web
    ecosystem: pub
    owner: ElevenID
    upstream: https://github.com/juliansteenbakker/flutter_secure_storage
    current: local-wasm-override
    target: upstream-release
    status: watch
    decision: replace
    advisories: []
    tracking-issue: https://github.com/ElevenID/marty-authenticator/issues/11
    review-after: 2026-11-20
    rationale: Re-reviewed 2026-11-06 against upstream commit 10126973316682dd1bae779d86a91a501359b11b (flutter_secure_storage_web pubspec, changelog and implementation) and this branch's pubspec.lock and consumers. Upstream remains 2.1.1 and uses modern web/JS interop with secure-context WebCrypto; the original dart:html rationale is obsolete. The resolved graph still selects the local override, and WalletCredentialStore and card state still consume its namespaced SharedPreferences/base64 format, which is not encrypted and is incompatible with upstream encrypted records. The Open Badges retirement does not remove this dependency. Issue 11 remains open; preserve existing records until a reviewed migration qualifies successful and failed writes, readback, rollback, namespace isolation and logout/deletion, as specified in docs/development-checks.md. This review does not qualify browser storage security or change its implementation.
