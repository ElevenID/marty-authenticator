version: 1
dependencies:
  - package: permission_handler
    ecosystem: pub
    owner: ElevenID
    upstream: https://github.com/Baseflow/flutter-permission-handler
    current: 12.0.3
    target: 13.x
    status: watch
    decision: upgrade
    advisories: []
    tracking-issue: https://github.com/ElevenID/marty-authenticator/issues/25
    review-after: 2026-11-15
    rationale: Rechecked 2026-10-16 against the upstream 13.0.2 changelog and Google's repository2-3.xml. Android 37.0 is now published, but this application still compiles against SDK 36. Version 13 requires SDK 37 and changes Android permanentlyDenied handling to a request-driven flow. Retain 12.0.3 until the platform upgrade and permission behavior migration are validated together in issue 25.
  - package: flutter_secure_storage_web
    ecosystem: pub
    owner: ElevenID
    upstream: https://github.com/juliansteenbakker/flutter_secure_storage
    current: local-wasm-override
    target: upstream-release
    status: watch
    decision: replace
    advisories: []
    tracking-issue: https://github.com/ElevenID/marty-authenticator/issues/11
    review-after: 2026-11-03
    rationale: Re-reviewed 2026-10-20 against https://pub.dev/packages/flutter_secure_storage_web/changelog and current consumers. Upstream 2.1.1 uses modern web/JS interop; the original dart:html compatibility rationale is obsolete. Removal is now gated by browser credential/state migration and real secure-context storage tests, not missing upstream WASM work. WalletCredentialStore and card state still consume the override, whose SharedPreferences/base64 format is not encrypted and differs from upstream WebCrypto storage. Preserve existing records until a reviewed migration qualifies successful and failed writes, rollback, namespace isolation and logout/deletion. Track the open migration in issue 11; see docs/development-checks.md. No storage implementation is changed by this review.
