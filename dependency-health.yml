version: 1
dependencies:
  - package: permission_handler
    ecosystem: pub
    owner: ElevenID
    upstream: https://github.com/Baseflow/flutter-permission-handler
    current: 12.0.3
    target: 13.x
    status: watch
    decision: upgrade
    advisories: []
    tracking-issue: https://github.com/ElevenID/marty-authenticator/issues/25
    review-after: 2026-12-01
    rationale: Rechecked 2026-11-16 against upstream main dd5055571a1f8cddcaae714e54d3f6c347e50ec5 (13.0.2 changelog), Google's repository2-3.xml, android/app/build.gradle and both camera permission consumers. Android 37.0 through 37.2 are published, but this application still compiles against SDK 36. Version 13 requires SDK 37 and changes permanentlyDenied detection to a request-driven flow. QRScannerView requests permission, while DocumentView still checks isPermanentlyDenied before opening it. Retain 12.0.3 until the SDK and permission behavior migration are validated together in issue 25; SDK publication alone no longer blocks that work. Re-review by December 1; this decision does not qualify the upgrade or waive dependency checks.
  - package: flutter_secure_storage_web
    ecosystem: pub
    owner: ElevenID
    upstream: https://github.com/juliansteenbakker/flutter_secure_storage
    current: "2.1.1 (hosted, with bounded legacy migration)"
    target: complete upstream migration qualification
    status: watch
    decision: replace
    advisories: []
    tracking-issue: https://github.com/ElevenID/marty-authenticator/issues/11
    review-after: 2026-11-28
    rationale: Re-reviewed 2026-11-21 (UTC policy date) against current upstream commit 10126973316682dd1bae779d86a91a501359b11b, its web pubspec/changelog, pub.dev version history, this branch's manifests and migration implementation, and PR57 qualification records. The manifest and lock now select hosted 2.1.1 with SHA-256 073a62b3aeb866ab4ce795f960413948e51e5a42a9b0c8333b6daf5bb3208a1c; no local override remains. The browser-only adapter wraps upstream WebCrypto with bounded namespace locks, encrypted-record checks and exact readback before retiring recognized legacy records; failures and unknown records are preserved without a plaintext fallback. Sixteen controlled migration cases and the historical JS/WASM browser execution at a41c4d4 remain separate evidence. Storage source and storage package pins are unchanged from that execution, but no current-head browser run or full wallet acceptance is inferred. Retain watch/replace and open issue 11 for applicable migration, artifact and release qualification described in docs/browser-storage.md and PR57. Re-review by November 28 or on relevant upstream changes; this inventory correction changes no dependency, runtime behavior or acceptance gate.
