[package]
name = "marty-authenticator-bridge"
version = "0.1.0"
edition = "2021"
description = "Flutter bridge to marty-verification for credential operations"
license = "AGPL-3.0-only"
repository = "https://github.com/ElevenID/marty-authenticator"
rust-version = "1.87"

[lib]
name = "marty_authenticator_bridge"
crate-type = ["cdylib", "staticlib"]

[dependencies]
# Core crates from marty-core
marty-crypto = { git = "https://github.com/ElevenID/marty-core", rev = "bd96bd2f91ba921b7a9e42b1bc84356e3b40d5f0" }
marty-verification = { git = "https://github.com/ElevenID/marty-core", rev = "bd96bd2f91ba921b7a9e42b1bc84356e3b40d5f0", default-features = false, features = ["iaca", "csca"] }
# Wallet holders generate presentation proofs; Core defaults to verification only.
marty-zkp = { git = "https://github.com/ElevenID/marty-core", rev = "bd96bd2f91ba921b7a9e42b1bc84356e3b40d5f0", default-features = false, features = ["prover"] }

# OID4VCI/VP wallet (holder) â€” no issuer feature; wallet enables verifier support.
marty-oid4vci = { git = "https://github.com/ElevenID/marty-core", rev = "bd96bd2f91ba921b7a9e42b1bc84356e3b40d5f0", default-features = false, features = ["android-platform-tls", "wallet", "jwt_vc_json", "sd_jwt", "mso_mdoc", "zk_mdoc"] }
marty-iso18013 = { git = "https://github.com/ElevenID/marty-core", rev = "bd96bd2f91ba921b7a9e42b1bc84356e3b40d5f0" }

# Portable policy/profile client only; native trust-list acquisition is not a wallet role.
marty-sync = { git = "https://github.com/ElevenID/marty-verifier", rev = "4f08df7c134c26b3284b0ca2c80bc899f2940452", default-features = false }

# Biometric face verification (ONNX-backed for on-device matching)
marty-biometrics = { git = "https://github.com/ElevenID/marty-core", rev = "bd96bd2f91ba921b7a9e42b1bc84356e3b40d5f0", features = ["native", "onnx", "liveness"] }
marty-status = { git = "https://github.com/ElevenID/marty-core", rev = "bd96bd2f91ba921b7a9e42b1bc84356e3b40d5f0" }

# Flutter Rust Bridge
flutter_rust_bridge = "=2.13.0"

# Serialization for FFI
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value"] }

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Utilities
uuid = { version = "1.0", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.11"
base64 = "0.23"
url = "2.5"

# SD-JWT parsing
ssi-sd-jwt = "0.6"
ssi-claims = { version = "0.7", default-features = false }

# Async runtime for blocking calls
tokio = { version = "1.0", features = ["rt", "sync"] }

[build-dependencies]
flutter_rust_bridge_codegen = "=2.13.0"

[dev-dependencies]
reqwest = { version = "=0.13.5", default-features = false, features = ["json", "rustls"] }
# Accepted Core test-only remote signers. No software holder-key fallback.
marty-crypto-test-support = { git = "https://github.com/ElevenID/marty-core", rev = "bd96bd2f91ba921b7a9e42b1bc84356e3b40d5f0" }

# Android armv7 and iOS simulator builds need generated bindings for the locked TLS backend.
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.22"
rustls-platform-verifier = "0.7"

[target.'cfg(any(target_os = "android", all(target_os = "ios", target_abi = "sim")))'.dependencies]
aws-lc-sys = { version = "=0.47.0", default-features = false, features = ["bindgen"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

[patch.crates-io]
# One reviewed SSI graph across the wallet and its Core dependencies.
ecdsa = { git = "https://github.com/ElevenID/ssi-elevenid", rev = "8b546ef5dbcd6e806ec1c26a0c05296515798429" }
